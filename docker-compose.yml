services:
  postgres:
    container_name: payments-db
    image: bitnami/postgresql:latest
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: payments_db
    volumes:
      - payments_db_data:/bitnami/postgresql
    networks:
      - payments-network

volumes:
  payments_db_data:

networks:
  payments-network:
    driver: bridge
